# Builds the app image and publishes it to this project's container registry at
# registry.git.zib.de.
#
# Uses buildah, not docker-in-docker: this GitLab keeps a runner dedicated to it
# (#169, tagged "buildah"), which is the institute saying how images are built
# here. Buildah needs no privileged Docker daemon, so the job needs no special
# permissions.

stages:
  - build

build-image:
  stage: build
  tags:
    - buildah
  rules:
    # Only the default branch. A feature branch would overwrite :latest.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    # CI_REGISTRY_USER and CI_REGISTRY_PASSWORD are issued by GitLab for the life
    # of the job; nothing needs configuring by hand.
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Two tags: :latest for convenience and the commit for deployments, which
    # should name a commit because :latest moves underneath them.
    - buildah bud
        -f docker/Dockerfile
        -t "$CI_REGISTRY_IMAGE:latest"
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        .
    - buildah push "$CI_REGISTRY_IMAGE:latest"
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  after_script:
    - echo "Published $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
