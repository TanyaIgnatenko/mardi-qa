# Builds the app image and publishes it to this project's container registry at
# registry.git.zib.de, so the ZIB copy of the repository produces its own image
# instead of relying on the GitHub mirror and ghcr.io.
#
# Needs a runner with Docker available. If the pipeline sits pending after a
# push, the project has no runner assigned — check Settings → CI/CD → Runners.

stages:
  - build

build-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    # Only the default branch. A branch tag would overwrite :latest for everyone.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    # CI_REGISTRY_USER and CI_REGISTRY_PASSWORD are provided by GitLab for the
    # duration of the job; nothing needs to be configured by hand.
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # The commit tag is the one to deploy from: :latest moves, a commit does not.
    - docker build
        -f docker/Dockerfile
        -t "$CI_REGISTRY_IMAGE:latest"
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  after_script:
    - echo "Published $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
